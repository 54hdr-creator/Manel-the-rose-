<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Red Rose Growing</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f}
.scene{width:100vw;height:100vh;position:relative}
.rose{position:absolute;left:50%;bottom:10%;width:220px;height:430px;transform:translateX(-50%)}
.soil{position:absolute;left:50%;bottom:0;width:90px;height:18px;transform:translateX(-50%) scaleX(.1);border-radius:50%;background:radial-gradient(ellipse,#4a3328,#1c1715);opacity:0;animation:soil 1s ease-out .2s forwards}
.stem{position:absolute;left:108px;bottom:14px;width:9px;height:0;border-radius:10px;background:linear-gradient(90deg,#173d20,#5a9d45,#214f27);transform-origin:bottom;animation:stem 5.2s cubic-bezier(.2,.8,.2,1) 1s forwards;z-index:2}
.leaf{position:absolute;width:72px;height:34px;background:linear-gradient(135deg,#173f20,#5d9d45 55%,#234d29);border-radius:100% 0 100% 0;opacity:0;z-index:3}
.left{left:43px;bottom:145px;transform-origin:right center;transform:rotate(-32deg) scale(0);animation:leaf .9s ease-out 2.7s forwards}
.right{left:107px;bottom:205px;transform-origin:left center;transform:rotate(28deg) scale(0);border-radius:0 100% 0 100%;animation:leafR .9s ease-out 3.05s forwards}
.left2{left:42px;bottom:250px;transform-origin:right center;transform:rotate(-28deg) scale(0);animation:leaf .9s ease-out 3.35s forwards}
.bud{position:absolute;left:77px;bottom:290px;width:68px;height:75px;border-radius:50% 50% 42% 42%;background:linear-gradient(135deg,#5e0712,#c3142e 55%,#780919);opacity:0;transform:scale(.08) translateY(35px);animation:bud 2s cubic-bezier(.2,.8,.2,1) 3.65s forwards;z-index:5}
.petals{position:absolute;left:50%;bottom:300px;width:150px;height:150px;transform:translateX(-50%) scale(.03);opacity:0;animation:bloom 2.5s cubic-bezier(.2,.7,.2,1) 5.15s forwards;z-index:6}
.petal{position:absolute;left:50%;top:50%;width:62px;height:88px;transform-origin:50% 82%;border-radius:58% 42% 55% 45%;background:radial-gradient(ellipse at 35% 28%,#ff5263 0 12%,#e9233e 35%,#a2071c 78%,#590511 100%);box-shadow:0 3px 12px rgba(120,0,20,.45)}
.p1{transform:translate(-50%,-75%) rotate(0)}.p2{transform:translate(-50%,-75%) rotate(55deg)}.p3{transform:translate(-50%,-75%) rotate(110deg)}.p4{transform:translate(-50%,-75%) rotate(165deg)}.p5{transform:translate(-50%,-75%) rotate(220deg)}.p6{transform:translate(-50%,-75%) rotate(275deg)}
.inner{position:absolute;left:50%;top:50%;width:58px;height:70px;transform:translate(-50%,-55%);border-radius:50%;background:radial-gradient(circle at 45% 25%,#ff6470,#d20e29 55%,#680514)}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff;opacity:0;animation:spark .9s ease-out forwards}.s1{left:52px;bottom:350px;animation-delay:6.1s}.s2{left:154px;bottom:370px;animation-delay:6.45s}.s3{left:86px;bottom:405px;animation-delay:6.8s}
@keyframes soil{to{opacity:1;transform:translateX(-50%) scaleX(1)}}@keyframes stem{0%{height:0}45%{height:190px;transform:rotate(-2deg)}75%{height:300px;transform:rotate(1.5deg)}100%{height:330px;transform:rotate(0)}}@keyframes leaf{0%{opacity:0;transform:rotate(-32deg) scale(0)}70%{opacity:1;transform:rotate(-38deg) scale(1.08)}100%{opacity:1;transform:rotate(-32deg) scale(1)}}@keyframes leafR{0%{opacity:0;transform:rotate(28deg) scale(0)}70%{opacity:1;transform:rotate(34deg) scale(1.08)}100%{opacity:1;transform:rotate(28deg) scale(1)}}@keyframes bud{0%{opacity:0;transform:scale(.08) translateY(35px)}30%{opacity:1}100%{opacity:1;transform:scale(1) translateY(0)}}@keyframes bloom{0%{opacity:0;transform:translateX(-50%) scale(.03)}15%{opacity:1}55%{transform:translateX(-50%) scale(.78)}100%{opacity:1;transform:translateX(-50%) scale(1)}}@keyframes spark{0%{opacity:0;transform:translateY(8px) scale(.2)}35%{opacity:.8}100%{opacity:0;transform:translateY(-20px) scale(1)}}
</style>
</head>
<body><div class="scene"><div class="rose"><div class="soil"></div><div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div><div class="leaf left2"></div><div class="bud"></div><div class="petals"><div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div><div class="inner"></div></div><div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div></div></div></body>
</html>
